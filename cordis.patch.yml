- insert:
    - id: aen-policy
      name: 'dsh-akn-plugin/policy'
      config:
        captureSkillContent: true
        captureSkillResources: false
        allowHubSearch: false

    - id: aen
      name: 'dsh-akn-plugin/provider'
      config:
        enabled: true
        storePath: .aen/evidence.sqlite
        harnessVersion: 0.1.0-rc.7
        snapshotDelayMs: 25

    - id: aen-tools
      name: 'dsh-akn-plugin/tools'
      disabled: true
      config: {}
